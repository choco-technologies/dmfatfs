name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmfatfs
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmfatfs.dmf
          test -f build/dmf/dmfatfs_version.txt
          test -f build/dmf/test_dmfatfs.dmf
          test -f build/dmf/mkfatfs.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmfatfs-local.dmd -y
          dmod_loader build/dmf/test_dmfatfs.dmf

  build-targets:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4
    strategy:
      matrix:
        arch: [ armv7/cortex-m4, armv7/cortex-m7 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmfatfs and mkfatfs
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_TOOLS_NAME=arch/${{ matrix.arch }}
          cmake --build . > build.log 2>&1 || { cat build.log; exit 1; }
          cat build.log
          if grep -E "warning:|error:" build.log | grep -v "build-id"; then
            echo "Compiler warnings found"
            exit 1
          fi
          test -f dmf/dmfatfs.dmf
          test -f dmf/mkfatfs.dmf
